name: BotHost Pro CI

on:
  push:
    branches: [ main, work ]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static check
        run: python -m compileall app.py

      - name: Smoke test routes
        run: |
          python - <<'PY'
          import json
          import threading
          import urllib.request
          from app import run

          thread = threading.Thread(target=run, daemon=True)
          thread.start()

          home = urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)
          assert home.status == 200

          api = urllib.request.urlopen('http://127.0.0.1:8000/api/plans', timeout=5)
          body = json.loads(api.read().decode())
          assert 'plans' in body and len(body['plans']) == 3
          print('Smoke tests passed')
          PY
